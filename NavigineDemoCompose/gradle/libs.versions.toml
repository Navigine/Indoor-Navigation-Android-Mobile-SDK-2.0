[versions]
agp = "8.11.2"
firebaseBom = "34.4.0"
kotlin = "2.2.20"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.09.01"
ksp = "2.2.20-2.0.3"
coroutines = "1.10.2"
coil = "2.7.0"
lottieCompose = "6.4.0"
navigation = "2.9.5"
datastore = "1.1.7"
hilt = "2.57.2"
